[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-postgre-server"
version = "0.1.0"
description = "Production-ready PostgreSQL MCP server for safe schema discovery, queries, migrations, and test data generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GitPilot MCP Contributors" }]
dependencies = [
  "mcp>=1.23.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlglot>=26.0.0",
  "uvicorn>=0.30.0",
  "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
mcp-postgre-server = "mcp_postgre_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_postgre_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert is fine in tests; S104: binding 0.0.0.0 is intentional for a
# containerised server; reviewers will set MCP_SERVER_HOST=127.0.0.1 if they
# want to restrict it.
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
# Tool modules generate or wrap SQL on purpose:
#   query.py  - executes a sqlglot-validated, parameterised SELECT inside a
#               wrapper LIMIT clause. The user-supplied SQL never reaches the
#               driver verbatim; the f-string composes a static envelope.
#   repository.py - returns SQL fragments as code-generation OUTPUT, not as
#               queries this server executes.
#   test_data.py  - INSERTs into a test fixture target by name; the schema/
#               table identifiers come from the trusted policy decision and
#               literal values are escaped via _literal(). S311 (random) is
#               also fine: the rng only seeds fake fixture values.
"src/mcp_postgre_server/tools/query.py" = ["S608"]
"src/mcp_postgre_server/tools/repository.py" = ["S608"]
"src/mcp_postgre_server/tools/test_data.py" = ["S608", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_postgre_server"]
