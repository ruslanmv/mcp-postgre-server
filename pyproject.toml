[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-postgre-server"
version = "0.1.0"
description = "Production-ready PostgreSQL MCP server for safe schema discovery, queries, migrations, and test data generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GitPilot MCP Contributors" }]
dependencies = [
  "mcp>=1.23.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlglot>=26.0.0",
  "uvicorn>=0.30.0",
  "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
mcp-postgre-server = "mcp_postgre_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_postgre_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_postgre_server"]
