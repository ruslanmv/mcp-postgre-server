services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gitpilot
      POSTGRES_PASSWORD: gitpilot
      POSTGRES_DB: gitpilot_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpilot -d gitpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-postgre-server:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
